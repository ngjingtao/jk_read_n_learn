name: CI

# Nothing in this project has ever run on real hardware, because the machine it
# was written on has no Android SDK and no Xcode. This workflow is how that gap
# gets closed: every push builds the real thing on real toolchains.
#
# What each job buys you:
#   analyse-test  fast feedback, runs first, gates everything else
#   android       proves the manifest, Gradle config and all plugins link
#   ios           proves the Info.plist and CocoaPods link (needs macOS)
#   web           fastest full Dart compile; also a demo you can open in a browser

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  analyse-test:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Fails the build if lib/l10n/generated is out of date with the .arb files,
      # which is easy to forget after editing a translation.
      - name: Regenerate localisations
        run: flutter gen-l10n

      - name: Fail if generated localisations are stale
        run: git diff --exit-code -- lib/l10n/generated

      - run: flutter analyze

      - run: flutter test --reporter expanded

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyse-test
    # Needed to publish the rolling release below. Everything else in this
    # workflow only reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The release build is signed with the debug key (see android/app/build.gradle.kts),
      # so it needs no secrets. Fine for internal testing, not for the Play Store.
      - name: Build release APK
        shell: bash
        # pipefail so `tee` cannot swallow Gradle's non-zero exit code.
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee android-build.log

      # Gradle buries the actual cause of a failure hundreds of lines deep, and
      # raw job logs need authentication to read. Publishing the real errors as
      # workflow annotations makes the failure readable straight from the UI —
      # and from the public API, which means a broken build can be diagnosed
      # without asking a human to copy-paste the log.
      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          echo "--- errors found in the build log ---"
          grep -nE "error:|FAILURE:|Execution failed|What went wrong|Caused by:|requires libraries" android-build.log \
            | tail -n 20 \
            | while IFS= read -r line; do
                escaped="${line//%/%25}"
                echo "::error::${escaped}"
              done
          echo "--- last 40 lines of the build ---"
          tail -n 40 android-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jk-read-n-learn-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Workflow artifacts need a GitHub login and expire after 90 days, which
      # is no good for a link you want to open on a tablet months from now. A
      # release asset is permanent, public, and downloadable straight from the
      # tablet's browser.
      - name: Rename the APK for a readable download link
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/jk-read-n-learn.apk

      - name: Publish the APK as a rolling release
        uses: softprops/action-gh-release@v2
        with:
          # Deliberately not a version number. A fixed tag means the download
          # URL never changes, so the link can be bookmarked on a tablet.
          tag_name: latest
          name: Latest build
          make_latest: true
          body: |
            Built automatically from commit `${{ github.sha }}`.

            **To install on an Android tablet:** open this page on the tablet and
            tap `jk-read-n-learn.apk` below. Android will ask you to allow
            installing unknown apps the first time.

            Signed with the debug key, so this is for testing and family use —
            it cannot be published to the Play Store.
          files: build/app/outputs/flutter-apk/jk-read-n-learn.apk

      - name: Point at the download
        run: |
          {
            echo "### Android APK"
            echo
            echo "https://github.com/${{ github.repository }}/releases/latest/download/jk-read-n-learn.apk"
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    needs: analyse-test
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # --no-codesign needs no Apple developer account. This proves the project
      # compiles and the microphone / speech-recognition usage strings are
      # present; it does not produce something installable on a device.
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: jk-read-n-learn-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error

  web:
    name: Build web
    runs-on: ubuntu-latest
    needs: analyse-test
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: jk-read-n-learn-web
          path: build/web
          if-no-files-found: error

  # Builds the exact image Render will build.
  #
  # Without this the Dockerfile is the one artefact in the repository that
  # nothing verifies: it cannot be built on the development machine (no Docker),
  # and a mistake in it only surfaces as a failed deploy on Render. This job
  # turns that into a red check on the pull request.
  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: analyse-test
    steps:
      - uses: actions/checkout@v5

      # The Flutter SDK alone extracts to roughly 3.5 GB, and ubuntu-latest
      # starts with about 14 GB free. Dropping the preinstalled Android SDK and
      # .NET runtimes buys back roughly 25 GB, which is the difference between a
      # reliable build and one that dies halfway through with "no space left on
      # device".
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build the image Render will build
        run: docker build -t jk-read-n-learn:ci .

      - name: Check the image actually serves the app
        run: |
          docker run -d --name smoke -e PORT=10000 -p 10000:10000 jk-read-n-learn:ci
          # Give nginx a moment to run envsubst and start.
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:10000/ > /tmp/index.html; then break; fi
            sleep 1
          done
          grep -q "JK Read n Learn" /tmp/index.html
          echo "--- container served the app ---"
          docker logs smoke
          docker rm -f smoke

  # Publishes the same build to GitHub Pages, which is the easiest way to get a
  # URL that works on an iPad or an Android tablet: free, HTTPS by default (the
  # microphone requires it), and no cold start.
  #
  # Requires Pages to be enabled once, in the repository settings:
  #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: analyse-test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # GitHub Pages serves from https://<user>.github.io/<repo>/, so every
      # asset URL has to be prefixed with the repository name. Without this the
      # page loads and then shows a blank screen, which is a confusing failure
      # to debug from a tablet.
      - name: Build web for a subpath
        run: >-
          flutter build web --release --no-wasm-dry-run
          --base-href /${{ github.event.repository.name }}/

      # Note: this cannot turn Pages on by itself. Creating a Pages site needs
      # repository-admin rights, which GITHUB_TOKEN never has, so `enablement:
      # true` fails with the misleading "Resource not accessible by
      # integration". Pages has to be switched on once by hand:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # After that this job is green on every push.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deploy
        uses: actions/deploy-pages@v4
